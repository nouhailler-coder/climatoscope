<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0e2a47" />
      <stop offset="60%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <linearGradient id="solarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="atmosphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Outer Solar Radiance Orbit -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 10" opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Core Earth Globe -->
  <circle cx="256" cy="256" r="110" fill="#0f172a" stroke="url(#atmosphere)" stroke-width="6" />

  <!-- Latitude / Longitude Scientific Observatory Grids -->
  <ellipse cx="256" cy="256" rx="110" ry="48" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <ellipse cx="256" cy="256" rx="110" ry="85" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />
  <line x1="256" y1="146" x2="256" y2="366" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <line x1="146" y1="256" x2="366" y2="256" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

  <!-- Atmospheric Wave Curve (Oscillation / CO2 & Temp trend) -->
  <path d="M 166 280 Q 210 220 256 250 T 346 220" fill="none" stroke="url(#solarGlow)" stroke-width="5" stroke-linecap="round" />

  <!-- Scientific measurement nodes -->
  <circle cx="210" cy="235" r="5" fill="#f59e0b" />
  <circle cx="256" cy="250" r="5" fill="#38bdf8" />
  <circle cx="310" cy="225" r="5" fill="#ef4444" />
  
  <!-- Compass / Telescope reticle tick marks -->
  <line x1="256" y1="80" x2="256" y2="105" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="407" x2="256" y2="432" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="256" x2="105" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <line x1="407" y1="256" x2="432" y2="256" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
</svg>
